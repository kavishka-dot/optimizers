<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LossLens</title>
<script>
MathJax={tex:{inlineMath:[['$','$']]},options:{skipHtmlTags:['script','noscript','style','textarea']},chtml:{scale:1.6,minScale:1.0},startup:{typeset:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0c10;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}

/* ── root layout ── */
#app{display:flex;flex-direction:column;height:100vh}

/* top bar */
#topbar{display:flex;align-items:center;padding:0 20px;height:60px;border-bottom:1px solid #1c1c28;flex-shrink:0;gap:14px}
#topbar h1{font-size:28px;font-weight:700;color:#fff;letter-spacing:.01em;font-family:'Space Grotesk',sans-serif;white-space:nowrap}
#topbar .sub{font-size:13px;color:#aaa;margin-left:2px;white-space:nowrap}
#inf{margin-left:auto;font-size:11px;color:#444;font-family:'Courier New',monospace}

/* main row */
#main{display:flex;flex:1;overflow:hidden}

/* ── LEFT SIDEBAR ── */
#sidebar{width:400px;flex-shrink:0;border-right:1px solid #1c1c28;display:flex;flex-direction:column;overflow:hidden}

#opt-list{padding:12px 10px 8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
#opt-list .sec{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;padding-left:4px}

.ob{width:100%;text-align:left;padding:11px 14px;border-radius:8px;border:none;background:#16161f;color:#999;font-size:16px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:11px}
.ob:hover{background:#1e1e2c;color:#ddd}
.ob.active{color:#fff;font-weight:700}
.ob .swatch{width:16px;height:16px;border-radius:5px;flex-shrink:0}
.ob .steps{margin-left:auto;font-size:10px;font-family:'Courier New',monospace;color:#444}
.ob.active .steps{color:#666}

/* equation + params panel */
#panel{flex:1;overflow-y:auto;border-top:1px solid #1c1c28;padding:14px 14px 20px}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-track{background:transparent}
#panel::-webkit-scrollbar-thumb{background:#222;border-radius:2px}

#p-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#p-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
#p-title{font-size:15px;font-weight:700;color:#ddd}

.sec-label{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}

#eq-content{line-height:3.2;font-size:17px;color:#bbb;margin-bottom:4px}
#eq-content .eq-row{margin-bottom:2px}
#p-note{font-size:14px;color:#7a7a9a;line-height:1.7;margin-top:8px;margin-bottom:14px;padding:10px;background:#111118;border-radius:6px;border-left:2px solid #333}

.param-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.param-row label{font-size:16px;color:#777;min-width:70px;flex-shrink:0}
.param-row input[type=range]{flex:1;accent-color:#6366f1;cursor:pointer;height:3px}
.param-row .val{font-size:11px;color:#bbb;min-width:46px;text-align:right;font-family:'Courier New',monospace}

#sidebar-footer{padding:10px;border-top:1px solid #1c1c28;display:flex;gap:6px;flex-shrink:0}
#clr{flex:1;font-size:11px;padding:6px;border:1px solid #222;border-radius:6px;background:transparent;color:#555;cursor:pointer}
#clr:hover{color:#ccc;background:#1a1a2a}

/* ── RIGHT CANVAS ── */
#canvas-wrap{flex:1;display:flex;align-items:stretch;justify-content:stretch;overflow:hidden;position:relative}
#c{display:block;cursor:crosshair;width:100%;height:100%}

/* legend overlay */
#legend{position:absolute;bottom:14px;left:14px;display:flex;flex-wrap:wrap;gap:10px;pointer-events:none}
#legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:#aaa;background:rgba(10,10,16,.7);padding:3px 8px;border-radius:5px}
#legend .dot{width:10px;height:3px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <svg width="38" height="38" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;overflow:visible">
      <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1e1e3a"/>
          <stop offset="100%" stop-color="#0c0c18"/>
        </radialGradient>
      </defs>
      <circle cx="15" cy="15" r="14" fill="url(#bg)" stroke="#2a2a4a" stroke-width="0.5"/>
      <ellipse cx="15" cy="15" rx="12" ry="8"  fill="none" stroke="#1a3a2a" stroke-width="0.8"/>
      <ellipse cx="15" cy="15" rx="9"  ry="5.5" fill="none" stroke="#1e4a30" stroke-width="0.8"/>
      <ellipse cx="15" cy="15" rx="6"  ry="3.5" fill="none" stroke="#236640" stroke-width="0.8"/>
      <ellipse cx="15" cy="15" rx="3.5" ry="2"  fill="none" stroke="#2a8850" stroke-width="0.8"/>
      <polyline points="4,6 8,9 11,12 13,14 14.5,14.8" fill="none" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="26,5 22,8 18,11 16,13 14.8,14.6" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="6,24 9,20 12,17 14,15.5 14.6,15" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="15" cy="15" r="2.2" fill="#fff"/>
      <circle cx="15" cy="15" r="1.4" fill="#a78bfa"/>
    </svg>
    <h1>LossLens</h1>
    <span class="sub">optimizer descent visualizer</span>
    <div id="inf">click the canvas to drop a particle</div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="opt-list">
        <div class="sec">optimizers</div>
        <button class="ob active" data-opt="gd"><span class="swatch" style="background:#facc15"></span>Gradient Descent<span class="steps"></span></button>
        <button class="ob" data-opt="momentum"><span class="swatch" style="background:#22d3ee"></span>Momentum<span class="steps"></span></button>
        <button class="ob" data-opt="adagrad"><span class="swatch" style="background:#c084fc"></span>AdaGrad<span class="steps"></span></button>
        <button class="ob" data-opt="adam"><span class="swatch" style="background:#fb923c"></span>Adam<span class="steps"></span></button>
        <button class="ob" data-opt="sofia"><span class="swatch" style="background:#4ade80"></span>Sofia<span class="steps"></span></button>
        <button class="ob" data-opt="lion"><span class="swatch" style="background:#f472b6"></span>Lion<span class="steps"></span></button>
      </div>

      <!-- equation + params -->
      <div id="panel">
        <div id="p-header">
          <span id="p-dot"></span>
          <span id="p-title"></span>
        </div>
        <div class="sec-label">update rule</div>
        <div id="eq-content"></div>
        <div id="p-note"></div>
        <div class="sec-label" id="hp-label">hyperparameters</div>
        <div id="params-content"></div>
      </div>

      <div id="sidebar-footer">
        <button id="clr">clear all particles</button>
      </div>
    </div>

    <!-- CANVAS -->
    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <div id="legend"></div>
    </div>

  </div>
</div>

<script>
// ── colors / labels ──
const OC={gd:'#facc15',momentum:'#22d3ee',adagrad:'#c084fc',adam:'#fb923c',sofia:'#4ade80',lion:'#f472b6'};
const OL={gd:'Gradient Descent',momentum:'Momentum',adagrad:'AdaGrad',adam:'Adam',sofia:'Sofia',lion:'Lion'};

// ── optimizer config ──
const OPTS={
  gd:{
    params:[{key:'lr',label:'\\eta',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)}],
    eqs:['$\\theta \\leftarrow \\theta - \\eta\\,\\nabla f(\\theta)$'],
    note:'Pure steepest descent. No memory, no adaptation. Fast on convex surfaces, easily trapped in local minima.'
  },
  momentum:{
    params:[
      {key:'lr',label:'\\eta',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'mu',label:'\\mu',min:0.1,max:0.99,step:0.01,val:0.88,fmt:v=>v.toFixed(2)}
    ],
    eqs:[
      '$v \\leftarrow \\mu v - \\eta\\,\\nabla f(\\theta)$',
      '$\\theta \\leftarrow \\theta + v$'
    ],
    note:'Accumulates velocity along consistent gradient directions. Overshoots curves but escapes shallow basins.'
  },
  adagrad:{
    params:[
      {key:'lr',label:'\\eta',min:0.5,max:40,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'eps',label:'\\varepsilon',min:1e-8,max:0.1,step:0.0001,val:1e-6,fmt:v=>v.toExponential(1)}
    ],
    eqs:[
      '$G \\leftarrow G + \\nabla f^2$',
      '$\\theta \\leftarrow \\theta - \\dfrac{\\eta}{\\sqrt{G}+\\varepsilon}\\,\\nabla f$'
    ],
    note:'Adapts lr per dimension using accumulated squared gradients. Stalls in flat regions as G grows unboundedly.'
  },
  adam:{
    params:[
      {key:'lr',label:'\\eta',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'b1',label:'\\beta_1',min:0.5,max:0.999,step:0.001,val:0.9,fmt:v=>v.toFixed(3)},
      {key:'b2',label:'\\beta_2',min:0.5,max:0.9999,step:0.0001,val:0.999,fmt:v=>v.toFixed(4)},
      {key:'eps',label:'\\varepsilon',min:1e-9,max:1e-4,step:1e-9,val:1e-7,fmt:v=>v.toExponential(0)}
    ],
    eqs:[
      '$m \\leftarrow \\beta_1 m + (1-\\beta_1)\\nabla f$',
      '$v \\leftarrow \\beta_2 v + (1-\\beta_2)\\nabla f^2$',
      '$\\hat{m} = \\frac{m}{1-\\beta_1^t},\\quad \\hat{v} = \\frac{v}{1-\\beta_2^t}$',
      '$\\theta \\leftarrow \\theta - \\eta\\,\\dfrac{\\hat{m}}{\\sqrt{\\hat{v}}+\\varepsilon}$'
    ],
    note:'Bias-corrected first & second moment estimates. Most robust in practice — adapts both direction and scale.'
  },
  sofia:{
    params:[
      {key:'lr',label:'\\eta',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'b',label:'\\beta',min:0.5,max:0.999,step:0.001,val:0.9,fmt:v=>v.toFixed(3)},
      {key:'clip',label:'\\rho',min:1,max:50,step:1,val:18,fmt:v=>v.toFixed(0)}
    ],
    eqs:[
      '$m \\leftarrow \\beta m + (1-\\beta)\\nabla f$',
      '$h = |m|$',
      '$\\theta \\leftarrow \\theta - \\mathrm{clip}\\!\\left(\\dfrac{\\eta\\,\\nabla f}{h},\\,\\rho\\right)$'
    ],
    note:'Diagonal Hessian proxy via EMA of gradients. Clips large steps by ρ. Controlled on curved surfaces.'
  },
  lion:{
    params:[
      {key:'lr',label:'\\eta',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'b1',label:'\\beta_1',min:0.5,max:0.999,step:0.001,val:0.9,fmt:v=>v.toFixed(3)},
      {key:'b2',label:'\\beta_2',min:0.5,max:0.999,step:0.001,val:0.99,fmt:v=>v.toFixed(3)}
    ],
    eqs:[
      '$c = \\mathrm{sign}(\\beta_1 m + (1-\\beta_1)\\nabla f)$',
      '$\\theta \\leftarrow \\theta - \\eta\\,c$',
      '$m \\leftarrow \\beta_2 m + (1-\\beta_2)\\nabla f$'
    ],
    note:'Update magnitude is always exactly ±η. Direction only — no scale. Memory-efficient, angular trajectories.'
  }
};

const P={};
Object.keys(OPTS).forEach(k=>{P[k]={};OPTS[k].params.forEach(p=>P[k][p.key]=p.val);});

// ── panel render ──
async function renderPanel(opt){
  const cfg=OPTS[opt];
  document.getElementById('p-dot').style.background=OC[opt];
  document.getElementById('p-dot').style.boxShadow=`0 0 6px ${OC[opt]}88`;
  document.getElementById('p-title').textContent=OL[opt];
  const eq=document.getElementById('eq-content');
  eq.innerHTML=cfg.eqs.map(e=>`<div class="eq-row">${e}</div>`).join('');
  document.getElementById('p-note').textContent=cfg.note;
  const pc=document.getElementById('params-content');
  pc.innerHTML='';
  cfg.params.forEach(pd=>{
    const row=document.createElement('div');row.className='param-row';
    const lbl=document.createElement('label');lbl.innerHTML=`$${pd.label}$`;
    const sl=document.createElement('input');sl.type='range';
    sl.min=pd.min;sl.max=pd.max;sl.step=pd.step;sl.value=P[opt][pd.key];
    const vs=document.createElement('span');vs.className='val';vs.textContent=pd.fmt(P[opt][pd.key]);
    sl.addEventListener('input',()=>{P[opt][pd.key]=parseFloat(sl.value);vs.textContent=pd.fmt(P[opt][pd.key]);});
    row.appendChild(lbl);row.appendChild(sl);row.appendChild(vs);
    pc.appendChild(row);
  });
  if(window.MathJax&&MathJax.typesetPromise){
    await MathJax.typesetPromise([document.getElementById('panel')]);
  }
}

let activeOpt='gd';
function styleButtons(){
  document.querySelectorAll('.ob').forEach(b=>{
    const o=b.dataset.opt;
    b.style.background=o===activeOpt?OC[o]+'22':'';
    b.style.borderLeft=o===activeOpt?`3px solid ${OC[o]}`:'3px solid transparent';
  });
}
document.querySelectorAll('.ob').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.ob').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');activeOpt=b.dataset.opt;
    renderPanel(activeOpt);styleButtons();
  });
});

// ── canvas setup ──
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W,H;

function resizeCanvas(){
  const wrap=document.getElementById('canvas-wrap');
  W=wrap.clientWidth;H=wrap.clientHeight;
  cv.width=W;cv.height=H;
  rebuildSurface();
  draw();
}

// ── noise ──
let seed=12345;
function rng(){seed=(seed*1664525+1013904223)&0xffffffff;return(seed>>>0)/4294967296;}
const NG=new Float32Array(64*64);
for(let i=0;i<64*64;i++)NG[i]=(rng()-0.5)*2;
function sNoise(nx,ny){
  const xi=((nx%64)+64)%64,yi=((ny%64)+64)%64;
  const x0=Math.floor(xi),y0=Math.floor(yi);
  const x1=(x0+1)%64,y1=(y0+1)%64;
  const fx=xi-x0,fy=yi-y0;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  return NG[y0*64+x0]*(1-sx)*(1-sy)+NG[y0*64+x1]*sx*(1-sy)+NG[y1*64+x0]*(1-sx)*sy+NG[y1*64+x1]*sx*sy;
}

function f(x,y){
  if(!W||!H)return 0;
  const nx=(x/W)*7-3.5,ny=(y/H)*6-3;
  const g1= 2.0*Math.exp(-((nx+2.0)*(nx+2.0)*0.9+(ny-1.5)*(ny-1.5)*0.8));
  const g2= 1.5*Math.exp(-((nx-1.8)*(nx-1.8)*1.2+(ny+1.8)*(ny+1.8)*1.0));
  const m1=-4.2*Math.exp(-((nx+0.2)*(nx+0.2)*0.25+(ny-0.8)*(ny-0.8)*0.22));
  const m2=-2.1*Math.exp(-((nx-2.2)*(nx-2.2)*1.1+(ny+0.5)*(ny+0.5)*0.9));
  const m3=-1.8*Math.exp(-((nx+2.5)*(nx+2.5)*1.0+(ny+2.0)*(ny+2.0)*1.2));
  const saddle=1.2*Math.exp(-ny*ny*0.4)*Math.exp(-(nx*nx*2.5));
  const banana=-1.0*Math.exp(-((nx-ny*0.5)*(nx-ny*0.5)*0.3+(ny+0.5)*(ny+0.5)*0.15));
  const nz=sNoise(nx*4,ny*4)*0.22+sNoise(nx*8,ny*8)*0.10;
  return g1+g2+m1+m2+m3+saddle+banana+nz;
}
function grad(x,y){
  const e=1.8;
  return{dx:(f(x+e,y)-f(x-e,y))/(2*e),dy:(f(x,y+e)-f(x,y-e))/(2*e)};
}

let vals,mn,mx,imgContour;
function rebuildSurface(){
  if(!W||!H)return;
  vals=new Float32Array(W*H);mn=Infinity;mx=-Infinity;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=f(x,y);vals[y*W+x]=v;if(v<mn)mn=v;if(v>mx)mx=v;}
  function colormap(t){
    const cp=[[0,[6,15,60]],[0.15,[15,60,120]],[0.30,[23,120,135]],[0.45,[38,143,75]],[0.55,[98,158,38]],[0.65,[165,165,23]],[0.78,[180,105,15]],[0.90,[165,45,15]],[1.0,[135,15,15]]];
    let i=0;while(i<cp.length-2&&t>cp[i+1][0])i++;
    const lo=cp[i],hi=cp[i+1],s=(t-lo[0])/(hi[0]-lo[0]);
    return[Math.round(lo[1][0]+(hi[1][0]-lo[1][0])*s),Math.round(lo[1][1]+(hi[1][1]-lo[1][1])*s),Math.round(lo[1][2]+(hi[1][2]-lo[1][2])*s)];
  }
  const imgBase=ctx.createImageData(W,H);
  for(let i=0;i<W*H;i++){const t=(vals[i]-mn)/(mx-mn);const[r,g,b]=colormap(t);imgBase.data[i*4]=r;imgBase.data[i*4+1]=g;imgBase.data[i*4+2]=b;imgBase.data[i*4+3]=255;}
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;
  const ox=oc.getContext('2d');ox.putImageData(imgBase,0,0);
  const N=24;
  for(let ci=0;ci<N;ci++){
    const lv=mn+(mx-mn)*(ci/(N-1)),t=ci/(N-1);
    ox.strokeStyle=t<0.4?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.35)';
    ox.lineWidth=ci%4===0?1.0:0.35;
    for(let y=1;y<H-1;y+=2){
      let inLine=false;
      for(let x=0;x<W;x++){
        const above=vals[y*W+x]>=lv,prev=x>0&&vals[y*W+x-1]>=lv;
        if(above!==prev){if(!inLine){ox.beginPath();ox.moveTo(x,y);inLine=true;}else{ox.lineTo(x,y);ox.stroke();inLine=false;}}
      }
    }
  }
  imgContour=ox.getImageData(0,0,W,H);
}

// ── particles ──
let particles=[],animId=null;

document.getElementById('clr').addEventListener('click',()=>{
  particles=[];if(!animId)draw();updateLegend();updateStepCounts();
  document.getElementById('inf').textContent='click the canvas to drop a particle';
});

function mkP(opt,x,y){
  const p={opt,x,y,trail:[{x,y}],done:false,steps:0,cfg:Object.assign({},P[opt])};
  if(opt==='momentum'){p.vx=0;p.vy=0;}
  if(opt==='adagrad'){p.Gx=1e-8;p.Gy=1e-8;}
  if(opt==='adam'){p.mx=0;p.my=0;p.vx2=0;p.vy2=0;p.t=0;}
  if(opt==='sofia'){p.mx=0;p.my=0;}
  if(opt==='lion'){p.mx=0;p.my=0;}
  return p;
}
function sign(x){return x>0?1:x<0?-1:0;}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
const GRAD_EPS=0.0008,MAX_STEPS=8000;

function stepP(p){
  if(p.done)return;
  const{dx,dy}=grad(p.x,p.y);
  if(Math.sqrt(dx*dx+dy*dy)<GRAD_EPS){p.done=true;return;}
  const c=p.cfg,lr=c.lr||9;let ux=0,uy=0;
  if(p.opt==='gd'){ux=-lr*dx;uy=-lr*dy;}
  else if(p.opt==='momentum'){const mu=c.mu||0.88;p.vx=mu*p.vx-lr*dx;p.vy=mu*p.vy-lr*dy;ux=p.vx;uy=p.vy;}
  else if(p.opt==='adagrad'){const eps=c.eps||1e-6;p.Gx+=dx*dx;p.Gy+=dy*dy;ux=-lr*dx/(Math.sqrt(p.Gx)+eps);uy=-lr*dy/(Math.sqrt(p.Gy)+eps);}
  else if(p.opt==='adam'){const b1=c.b1||0.9,b2=c.b2||0.999,eps=c.eps||1e-7;p.t++;p.mx=b1*p.mx+(1-b1)*dx;p.my=b1*p.my+(1-b1)*dy;p.vx2=b2*p.vx2+(1-b2)*dx*dx;p.vy2=b2*p.vy2+(1-b2)*dy*dy;const mhx=p.mx/(1-Math.pow(b1,p.t)),mhy=p.my/(1-Math.pow(b1,p.t)),vhx=p.vx2/(1-Math.pow(b2,p.t)),vhy=p.vy2/(1-Math.pow(b2,p.t));ux=-lr*mhx/(Math.sqrt(vhx)+eps);uy=-lr*mhy/(Math.sqrt(vhy)+eps);}
  else if(p.opt==='sofia'){const b=c.b||0.9,rho=c.clip||18,eps=1e-3;p.mx=b*p.mx+(1-b)*dx;p.my=b*p.my+(1-b)*dy;ux=clamp(-lr*dx/Math.max(eps,Math.abs(p.mx)),-rho,rho);uy=clamp(-lr*dy/Math.max(eps,Math.abs(p.my)),-rho,rho);}
  else if(p.opt==='lion'){const b1=c.b1||0.9,b2=c.b2||0.99;const cx=sign(b1*p.mx+(1-b1)*dx),cy=sign(b1*p.my+(1-b1)*dy);p.mx=b2*p.mx+(1-b2)*dx;p.my=b2*p.my+(1-b2)*dy;ux=-lr*cx;uy=-lr*cy;}
  p.x=Math.max(2,Math.min(W-3,p.x+ux));p.y=Math.max(2,Math.min(H-3,p.y+uy));
  p.trail.push({x:p.x,y:p.y});p.steps++;
  if(p.steps>=MAX_STEPS)p.done=true;
}

function draw(){
  if(!imgContour)return;
  ctx.putImageData(imgContour,0,0);
  for(const p of particles){
    if(p.trail.length<2)continue;
    const col=OC[p.opt];
    ctx.shadowColor=col;ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(p.trail[0].x,p.trail[0].y);
    for(let i=1;i<p.trail.length;i++)ctx.lineTo(p.trail[i].x,p.trail[i].y);
    ctx.strokeStyle=col;ctx.lineWidth=3.5;ctx.stroke();
    ctx.shadowBlur=0;
    const last=p.trail[p.trail.length-1];
    if(p.done){
      ctx.beginPath();ctx.arc(last.x,last.y,11,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
      ctx.beginPath();ctx.arc(last.x,last.y,7,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    } else {
      ctx.shadowColor=col;ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(last.x,last.y,6,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.beginPath();ctx.arc(p.trail[0].x,p.trail[0].y,4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();
  }
}

function updateLegend(){
  const seen=[...new Set(particles.map(p=>p.opt))];
  document.getElementById('legend').innerHTML=seen.map(o=>
    `<span><span class="dot" style="background:${OC[o]};box-shadow:0 0 5px ${OC[o]}88"></span>${OL[o]}</span>`
  ).join('');
}

function updateStepCounts(){
  document.querySelectorAll('.ob').forEach(b=>{
    const o=b.dataset.opt;
    const ps=particles.filter(p=>p.opt===o);
    const sp=b.querySelector('.steps');
    if(ps.length===0){sp.textContent='';}
    else{const done=ps.filter(p=>p.done).length;sp.textContent=`${done}/${ps.length}`;}
  });
}

function tick(){
  let any=false;
  for(const p of particles){if(!p.done){for(let i=0;i<4;i++)stepP(p);if(!p.done)any=true;}}
  draw();
  updateStepCounts();
  const done=particles.filter(p=>p.done).length;
  if(particles.length){
    document.getElementById('inf').textContent=`${done}/${particles.length} converged`;
  }
  if(any)animId=requestAnimationFrame(tick);else animId=null;
}

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
  particles.push(mkP(activeOpt,x,y));
  updateLegend();
  if(!animId)animId=requestAnimationFrame(tick);
  document.getElementById('inf').textContent='descending…';
});

// ── init ──
window.addEventListener('load',()=>{
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  if(window.MathJax&&MathJax.promise){
    MathJax.promise.then(()=>renderPanel('gd'));
  } else {
    setTimeout(()=>renderPanel('gd'),600);
  }
  styleButtons();
});
</script>
</body>
</html>
