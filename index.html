<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optimizer Descent Visualizer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f13;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px;min-height:100vh}
h1{font-size:15px;font-weight:500;color:#888;margin-bottom:12px;letter-spacing:.05em}
canvas{display:block;cursor:crosshair;border-radius:10px;border:1px solid #222}
#controls{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;max-width:800px}
.ob{font-size:12px;padding:5px 13px;border:1px solid #2a2a3a;border-radius:7px;background:transparent;color:#888;cursor:pointer;transition:all .15s;position:relative}
.ob:hover{background:#1a1a2a;color:#ccc}
.ob.active{color:#fff;font-weight:600}
.ob .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
#clr{margin-left:auto;font-size:12px;padding:5px 12px;border:1px solid #2a2a3a;border-radius:7px;background:transparent;color:#666;cursor:pointer}
#clr:hover{color:#ccc;background:#1a1a2a}

/* param + equation panel */
#panel{width:100%;max-width:800px;margin-top:10px;border:1px solid #1e1e2e;border-radius:10px;overflow:hidden;background:#13131c}
#panel-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #1e1e2e}
#panel-title{font-size:13px;font-weight:600;color:#ddd}
#panel-subtitle{font-size:11px;color:#555}
#panel-body{display:flex;gap:0;flex-wrap:wrap}
#eq-box{flex:1;min-width:200px;padding:14px 16px;border-right:1px solid #1a1a26}
#eq-box .eq-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
#eq-content{font-family:'Courier New',monospace;font-size:12px;color:#aaa;line-height:1.8}
#eq-content .eq-line{display:flex;gap:6px;align-items:baseline;margin-bottom:2px}
#eq-content .var{color:#c084fc}
#eq-content .op{color:#666}
#eq-content .lit{color:#facc15}
#eq-content .comment{font-size:10px;color:#444;margin-left:6px}
#params-box{flex:1;min-width:200px;padding:14px 16px}
#params-box .eq-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.param-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.param-row label{font-size:11px;color:#888;min-width:80px;font-family:'Courier New',monospace}
.param-row input[type=range]{flex:1;accent-color:#6366f1;height:3px;cursor:pointer}
.param-row .val{font-size:11px;color:#ccc;min-width:38px;text-align:right;font-family:'Courier New',monospace}

#leg{margin-top:8px;display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:#666;width:100%;max-width:800px}
#inf{font-size:11px;color:#444;margin-top:6px;text-align:center;width:100%;max-width:800px;font-family:'Courier New',monospace}
</style>
</head>
<body>
<h1>optimizer descent visualizer</h1>
<canvas id="c"></canvas>
<div id="controls">
  <span style="font-size:11px;color:#555">optimizer:</span>
  <button class="ob active" data-opt="gd"><span class="dot" style="background:#facc15"></span>GD</button>
  <button class="ob" data-opt="momentum"><span class="dot" style="background:#22d3ee"></span>Momentum</button>
  <button class="ob" data-opt="adagrad"><span class="dot" style="background:#c084fc"></span>AdaGrad</button>
  <button class="ob" data-opt="adam"><span class="dot" style="background:#fb923c"></span>Adam</button>
  <button class="ob" data-opt="sofia"><span class="dot" style="background:#4ade80"></span>Sofia</button>
  <button class="ob" data-opt="lion"><span class="dot" style="background:#f472b6"></span>Lion</button>
  <button id="clr">clear</button>
</div>

<div id="panel">
  <div id="panel-header">
    <span id="panel-dot" style="width:9px;height:9px;border-radius:50%;background:#facc15;display:inline-block"></span>
    <span id="panel-title">Vanilla Gradient Descent</span>
    <span id="panel-subtitle" style="margin-left:4px">— click an optimizer above to change parameters</span>
  </div>
  <div id="panel-body">
    <div id="eq-box">
      <div class="eq-label">update rule</div>
      <div id="eq-content"></div>
    </div>
    <div id="params-box">
      <div class="eq-label">hyperparameters</div>
      <div id="params-content"></div>
    </div>
  </div>
</div>

<div id="leg"></div>
<div id="inf">click the surface to drop a particle — runs until ‖∇f‖ ≈ 0</div>

<script>
const W=800,H=500;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
function resize(){cv.style.width=Math.min(window.innerWidth-32,800)+'px';}
resize();window.addEventListener('resize',resize);

const OC={gd:'#facc15',momentum:'#22d3ee',adagrad:'#c084fc',adam:'#fb923c',sofia:'#4ade80',lion:'#f472b6'};
const OL={gd:'Vanilla Gradient Descent',momentum:'Momentum',adagrad:'AdaGrad',adam:'Adam',sofia:'Sofia (Scalar)',lion:'Lion'};

// ---- optimizer config: params + equations ----
const OPTS={
  gd:{
    params:[{key:'lr',label:'η  (lr)',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)}],
    eq:[
      '{var:θ} {op:=} {var:θ} {op:−} {lit:η} {op:·} {var:∇f(θ)}',
    ],
    note:'Pure steepest descent. No memory, no adaptation.'
  },
  momentum:{
    params:[
      {key:'lr',label:'η  (lr)',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'mu',label:'μ  (momentum)',min:0.1,max:0.99,step:0.01,val:0.88,fmt:v=>v.toFixed(2)}
    ],
    eq:[
      '{var:v} {op:=} {lit:μ} {var:v} {op:−} {lit:η} {var:∇f(θ)}',
      '{var:θ} {op:=} {var:θ} {op:+} {var:v}',
    ],
    note:'Accumulates velocity. Overshoots curves, escapes shallow basins.'
  },
  adagrad:{
    params:[
      {key:'lr',label:'η  (lr)',min:0.5,max:40,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'eps',label:'ε  (epsilon)',min:1e-8,max:1,step:0.001,val:1e-6,fmt:v=>v.toExponential(0)}
    ],
    eq:[
      '{var:G} {op:=} {var:G} {op:+} {var:∇f}² ',
      '{var:θ} {op:=} {var:θ} {op:−} {lit:η} {op:/} {op:(}√{var:G} {op:+} {lit:ε}{op:)} {op:·} {var:∇f}',
    ],
    note:'Shrinks lr per dimension. Stalls in flat regions over time.'
  },
  adam:{
    params:[
      {key:'lr',label:'η  (lr)',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'b1',label:'β₁',min:0.5,max:0.999,step:0.001,val:0.9,fmt:v=>v.toFixed(3)},
      {key:'b2',label:'β₂',min:0.5,max:0.9999,step:0.0001,val:0.999,fmt:v=>v.toFixed(4)},
      {key:'eps',label:'ε',min:1e-9,max:1e-4,step:1e-8,val:1e-7,fmt:v=>v.toExponential(0)}
    ],
    eq:[
      '{var:m} {op:=} {lit:β₁}{var:m} {op:+} {op:(1−}{lit:β₁}{op:)}{var:∇f}',
      '{var:v} {op:=} {lit:β₂}{var:v} {op:+} {op:(1−}{lit:β₂}{op:)}{var:∇f}²',
      '{var:m̂} {op:=} {var:m}{op:/(1−}{lit:β₁}{op:ᵗ)}  {var:v̂} {op:=} {var:v}{op:/(1−}{lit:β₂}{op:ᵗ)}',
      '{var:θ} {op:=} {var:θ} {op:−} {lit:η} {var:m̂} {op:/ (}√{var:v̂} {op:+} {lit:ε}{op:)}',
    ],
    note:'Bias-corrected first & second moment estimates.'
  },
  sofia:{
    params:[
      {key:'lr',label:'η  (lr)',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'b',label:'β  (EMA)',min:0.5,max:0.999,step:0.001,val:0.9,fmt:v=>v.toFixed(3)},
      {key:'clip',label:'ρ  (clip)',min:1,max:50,step:1,val:18,fmt:v=>v.toFixed(0)}
    ],
    eq:[
      '{var:m} {op:=} {lit:β}{var:m} {op:+} {op:(1−}{lit:β}{op:)}{var:∇f}',
      '{var:h} {op:=} |{var:m}|  {op:(diag Hessian proxy)}',
      '{var:θ} {op:=} {var:θ} {op:−} clip{op:(}{lit:η} {var:∇f} {op:/} {var:h}{op:,} {lit:ρ}{op:)}',
    ],
    note:'Scales by EMA-based curvature estimate. Clips large steps.'
  },
  lion:{
    params:[
      {key:'lr',label:'η  (lr)',min:0.5,max:30,step:0.5,val:9,fmt:v=>v.toFixed(1)},
      {key:'b1',label:'β₁  (interp)',min:0.5,max:0.999,step:0.001,val:0.9,fmt:v=>v.toFixed(3)},
      {key:'b2',label:'β₂  (decay)',min:0.5,max:0.999,step:0.001,val:0.99,fmt:v=>v.toFixed(3)}
    ],
    eq:[
      '{var:c} {op:=} sign{op:(}{lit:β₁}{var:m} {op:+} {op:(1−}{lit:β₁}{op:)}{var:∇f}{op:)}',
      '{var:θ} {op:=} {var:θ} {op:−} {lit:η} {var:c}',
      '{var:m} {op:=} {lit:β₂}{var:m} {op:+} {op:(1−}{lit:β₂}{op:)}{var:∇f}',
    ],
    note:'Update is always ±η. Constant magnitude, direction from sign.'
  }
};

// current param values
const P={};
Object.keys(OPTS).forEach(k=>{
  P[k]={};
  OPTS[k].params.forEach(p=>P[k][p.key]=p.val);
});

// ---- render panel ----
function renderEqLine(line){
  return line.replace(/\{(\w+):([^}]+)\}/g,(_,cls,val)=>`<span class="${cls}">${val}</span>`);
}

function renderPanel(opt){
  const cfg=OPTS[opt];
  document.getElementById('panel-dot').style.background=OC[opt];
  document.getElementById('panel-title').textContent=OL[opt];
  document.getElementById('panel-subtitle').textContent='';

  // equation
  const eq=document.getElementById('eq-content');
  eq.innerHTML=cfg.eq.map(l=>`<div class="eq-line">${renderEqLine(l)}</div>`).join('')+
    `<div style="margin-top:8px;font-size:10px;color:#444;font-family:sans-serif">${cfg.note}</div>`;

  // params
  const pc=document.getElementById('params-content');
  pc.innerHTML='';
  cfg.params.forEach(pd=>{
    const row=document.createElement('div');row.className='param-row';
    const lbl=document.createElement('label');lbl.textContent=pd.label;
    const sl=document.createElement('input');sl.type='range';
    sl.min=pd.min;sl.max=pd.max;sl.step=pd.step;sl.value=P[opt][pd.key];
    const vspan=document.createElement('span');vspan.className='val';vspan.textContent=pd.fmt(P[opt][pd.key]);
    sl.addEventListener('input',()=>{
      P[opt][pd.key]=parseFloat(sl.value);
      vspan.textContent=pd.fmt(P[opt][pd.key]);
    });
    row.appendChild(lbl);row.appendChild(sl);row.appendChild(vspan);
    pc.appendChild(row);
  });
}

let activeOpt='gd';
renderPanel('gd');
// set active button border color
function styleBtn(opt){
  document.querySelectorAll('.ob').forEach(b=>{
    b.style.borderColor=b.dataset.opt===opt?OC[opt]+'88':'#2a2a3a';
  });
}
styleBtn('gd');

document.querySelectorAll('.ob').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.ob').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    activeOpt=b.dataset.opt;
    renderPanel(activeOpt);
    styleBtn(activeOpt);
  });
});

// ---- noise ----
let seed=12345;
function rng(){seed=(seed*1664525+1013904223)&0xffffffff;return(seed>>>0)/4294967296;}
const NG=new Float32Array(64*64);
for(let i=0;i<64*64;i++)NG[i]=(rng()-0.5)*2;
function sNoise(nx,ny){
  const xi=((nx%64)+64)%64,yi=((ny%64)+64)%64;
  const x0=Math.floor(xi),y0=Math.floor(yi);
  const x1=(x0+1)%64,y1=(y0+1)%64;
  const fx=xi-x0,fy=yi-y0;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  return NG[y0*64+x0]*(1-sx)*(1-sy)+NG[y0*64+x1]*sx*(1-sy)+NG[y1*64+x0]*(1-sx)*sy+NG[y1*64+x1]*sx*sy;
}

function f(x,y){
  const nx=(x/W)*7-3.5,ny=(y/H)*6-3;
  const g1= 2.0*Math.exp(-((nx+2.0)*(nx+2.0)*0.9+(ny-1.5)*(ny-1.5)*0.8));
  const g2= 1.5*Math.exp(-((nx-1.8)*(nx-1.8)*1.2+(ny+1.8)*(ny+1.8)*1.0));
  const m1=-4.2*Math.exp(-((nx+0.2)*(nx+0.2)*0.25+(ny-0.8)*(ny-0.8)*0.22));
  const m2=-2.1*Math.exp(-((nx-2.2)*(nx-2.2)*1.1+(ny+0.5)*(ny+0.5)*0.9));
  const m3=-1.8*Math.exp(-((nx+2.5)*(nx+2.5)*1.0+(ny+2.0)*(ny+2.0)*1.2));
  const saddle=1.2*Math.exp(-ny*ny*0.4)*Math.exp(-(nx*nx*2.5));
  const banana=-1.0*Math.exp(-((nx-ny*0.5)*(nx-ny*0.5)*0.3+(ny+0.5)*(ny+0.5)*0.15));
  const nz=sNoise(nx*4,ny*4)*0.22+sNoise(nx*8,ny*8)*0.10;
  return g1+g2+m1+m2+m3+saddle+banana+nz;
}
function grad(x,y){
  const e=1.8;
  return{dx:(f(x+e,y)-f(x-e,y))/(2*e),dy:(f(x,y+e)-f(x,y-e))/(2*e)};
}

// precompute
const vals=new Float32Array(W*H);
let mn=Infinity,mx=-Infinity;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=f(x,y);vals[y*W+x]=v;if(v<mn)mn=v;if(v>mx)mx=v;}

function colormap(t){
  const cp=[[0,[8,20,80]],[0.15,[20,80,160]],[0.30,[30,160,180]],[0.45,[50,190,100]],[0.55,[130,210,50]],[0.65,[220,220,30]],[0.78,[240,140,20]],[0.90,[220,60,20]],[1.0,[180,20,20]]];
  let i=0;while(i<cp.length-2&&t>cp[i+1][0])i++;
  const lo=cp[i],hi=cp[i+1],s=(t-lo[0])/(hi[0]-lo[0]);
  return[Math.round(lo[1][0]+(hi[1][0]-lo[1][0])*s),Math.round(lo[1][1]+(hi[1][1]-lo[1][1])*s),Math.round(lo[1][2]+(hi[1][2]-lo[1][2])*s)];
}
const imgBase=ctx.createImageData(W,H);
for(let i=0;i<W*H;i++){
  const t=(vals[i]-mn)/(mx-mn);const[r,g,b]=colormap(t);
  imgBase.data[i*4]=r;imgBase.data[i*4+1]=g;imgBase.data[i*4+2]=b;imgBase.data[i*4+3]=255;
}
function buildContour(){
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;
  const ox=oc.getContext('2d');ox.putImageData(imgBase,0,0);
  const N=24;
  for(let ci=0;ci<N;ci++){
    const lv=mn+(mx-mn)*(ci/(N-1)),t=ci/(N-1);
    ox.strokeStyle=t<0.4?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.18)';
    ox.lineWidth=ci%4===0?1.2:0.45;
    for(let y=1;y<H-1;y+=2){
      let inLine=false;
      for(let x=0;x<W;x++){
        const above=vals[y*W+x]>=lv,prev=x>0&&vals[y*W+x-1]>=lv;
        if(above!==prev){
          if(!inLine){ox.beginPath();ox.moveTo(x,y);inLine=true;}
          else{ox.lineTo(x,y);ox.stroke();inLine=false;}
        }
      }
    }
  }
  return ox.getImageData(0,0,W,H);
}
const imgContour=buildContour();

// ---- particles ----
let particles=[],animId=null;

document.getElementById('clr').addEventListener('click',()=>{
  particles=[];if(!animId)draw();updateLeg();
  document.getElementById('inf').textContent='click the surface to drop a particle — runs until ‖∇f‖ ≈ 0';
});

function mkP(opt,x,y){
  const p={opt,x,y,trail:[{x,y}],done:false,steps:0,
    // snapshot params at spawn time so mid-run edits don't break state
    cfg:Object.assign({},P[opt])};
  if(opt==='momentum'){p.vx=0;p.vy=0;}
  if(opt==='adagrad'){p.Gx=1e-8;p.Gy=1e-8;}
  if(opt==='adam'){p.mx=0;p.my=0;p.vx2=0;p.vy2=0;p.t=0;}
  if(opt==='sofia'){p.mx=0;p.my=0;}
  if(opt==='lion'){p.mx=0;p.my=0;}
  return p;
}

function sign(x){return x>0?1:x<0?-1:0;}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}

const GRAD_EPS=0.0008,MAX_STEPS=8000;

function stepP(p){
  if(p.done)return;
  const{dx,dy}=grad(p.x,p.y);
  if(Math.sqrt(dx*dx+dy*dy)<GRAD_EPS){p.done=true;return;}
  const c=p.cfg;
  const lr=c.lr||9;
  let ux=0,uy=0;
  if(p.opt==='gd'){
    ux=-lr*dx;uy=-lr*dy;
  } else if(p.opt==='momentum'){
    const mu=c.mu||0.88;
    p.vx=mu*p.vx-lr*dx;p.vy=mu*p.vy-lr*dy;ux=p.vx;uy=p.vy;
  } else if(p.opt==='adagrad'){
    const eps=c.eps||1e-6;
    p.Gx+=dx*dx;p.Gy+=dy*dy;
    ux=-lr*dx/(Math.sqrt(p.Gx)+eps);uy=-lr*dy/(Math.sqrt(p.Gy)+eps);
  } else if(p.opt==='adam'){
    const b1=c.b1||0.9,b2=c.b2||0.999,eps=c.eps||1e-7;
    p.t++;
    p.mx=b1*p.mx+(1-b1)*dx;p.my=b1*p.my+(1-b1)*dy;
    p.vx2=b2*p.vx2+(1-b2)*dx*dx;p.vy2=b2*p.vy2+(1-b2)*dy*dy;
    const mhx=p.mx/(1-Math.pow(b1,p.t)),mhy=p.my/(1-Math.pow(b1,p.t));
    const vhx=p.vx2/(1-Math.pow(b2,p.t)),vhy=p.vy2/(1-Math.pow(b2,p.t));
    ux=-lr*mhx/(Math.sqrt(vhx)+eps);uy=-lr*mhy/(Math.sqrt(vhy)+eps);
  } else if(p.opt==='sofia'){
    const b=c.b||0.9,rho=c.clip||18,eps=1e-3;
    p.mx=b*p.mx+(1-b)*dx;p.my=b*p.my+(1-b)*dy;
    ux=clamp(-lr*dx/Math.max(eps,Math.abs(p.mx)),-rho,rho);
    uy=clamp(-lr*dy/Math.max(eps,Math.abs(p.my)),-rho,rho);
  } else if(p.opt==='lion'){
    const b1=c.b1||0.9,b2=c.b2||0.99;
    const cx=sign(b1*p.mx+(1-b1)*dx),cy=sign(b1*p.my+(1-b1)*dy);
    p.mx=b2*p.mx+(1-b2)*dx;p.my=b2*p.my+(1-b2)*dy;
    ux=-lr*cx;uy=-lr*cy;
  }
  p.x=Math.max(2,Math.min(W-3,p.x+ux));
  p.y=Math.max(2,Math.min(H-3,p.y+uy));
  p.trail.push({x:p.x,y:p.y});
  p.steps++;
  if(p.steps>=MAX_STEPS)p.done=true;
}

function draw(){
  ctx.putImageData(imgContour,0,0);
  for(const p of particles){
    if(p.trail.length<2)continue;
    const col=OC[p.opt];
    ctx.shadowColor=col;ctx.shadowBlur=5;
    ctx.beginPath();ctx.moveTo(p.trail[0].x,p.trail[0].y);
    for(let i=1;i<p.trail.length;i++)ctx.lineTo(p.trail[i].x,p.trail[i].y);
    ctx.strokeStyle=col+'bb';ctx.lineWidth=2;ctx.stroke();
    ctx.shadowBlur=0;
    const last=p.trail[p.trail.length-1];
    if(p.done){
      ctx.beginPath();ctx.arc(last.x,last.y,8,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
      ctx.beginPath();ctx.arc(last.x,last.y,5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(last.x,last.y,4,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    }
    ctx.beginPath();ctx.arc(p.trail[0].x,p.trail[0].y,3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fill();
  }
}

function updateLeg(){
  const seen=[...new Set(particles.map(p=>p.opt))];
  document.getElementById('leg').innerHTML=seen.map(o=>
    `<span style="display:flex;align-items:center;gap:5px">
      <span style="width:14px;height:3px;background:${OC[o]};display:inline-block;border-radius:2px;box-shadow:0 0 5px ${OC[o]}66"></span>
      <span style="color:#aaa">${OL[o]}</span>
    </span>`
  ).join('');
}

function tick(){
  let any=false;
  for(const p of particles){if(!p.done){for(let i=0;i<4;i++)stepP(p);if(!p.done)any=true;}}
  draw();
  const done=particles.filter(p=>p.done).length;
  if(particles.length){
    const info=particles.map(p=>`${OL[p.opt].split(' ')[0]}:${p.steps}${p.done?'✓':''}`).join('  ');
    document.getElementById('inf').textContent=`${done}/${particles.length} converged  |  ${info}`;
  }
  if(any)animId=requestAnimationFrame(tick);else animId=null;
}

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
  particles.push(mkP(activeOpt,x,y));
  updateLeg();
  if(!animId)animId=requestAnimationFrame(tick);
  document.getElementById('inf').textContent='descending…';
});

draw();
</script>
</body>
</html>
